<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار البيانات المباشرة - NetWatch</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #050810 0%, #0d1220 100%);
            color: #e2e8f0;
            font-family: 'Tajawal', system-ui;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(15, 20, 25, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
        }
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        .header p {
            color: #cbd5e1;
            font-size: 1.1em;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(15, 20, 25, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
        }
        .stat-label {
            font-size: 0.9em;
            color: #cbd5e1;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #38bdf8;
            font-family: 'IBM Plex Mono', monospace;
            margin-bottom: 10px;
        }
        .stat-unit {
            font-size: 0.8em;
            color: #64748b;
        }
        .refresh-info {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            color: #34d399;
            font-size: 0.95em;
        }
        .update-time {
            text-align: center;
            color: #64748b;
            font-size: 0.85em;
            margin-top: 20px;
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
        .success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #34d399;
        }
        .loading {
            background: rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.3);
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 اختبار البيانات المباشرة</h1>
            <p>تحديث تلقائي كل 10 ثواني من MikroTik</p>
        </div>

        <div class="refresh-info" id="refreshInfo">
            🔄 جاري تحميل البيانات...
        </div>

        <div class="stats-grid">
            <div class="stat-card" id="networkCard">
                <div class="stat-label">🌐 اسم الشبكة</div>
                <div class="stat-value" id="networkName">--</div>
                <div class="stat-unit">Identity من MikroTik</div>
            </div>

            <div class="stat-card" id="internetCard">
                <div class="stat-label">📡 حالة الإنترنت</div>
                <div class="stat-value" id="internetStatus">--</div>
                <div class="stat-unit" id="internetMsg">جاري التحقق...</div>
            </div>

            <div class="stat-card" id="devicesCard">
                <div class="stat-label">💻 الأجهزة المتصلة</div>
                <div class="stat-value" id="deviceCount">--</div>
                <div class="stat-unit">من إجمالي الأجهزة</div>
            </div>

            <div class="stat-card" id="hotspotCard">
                <div class="stat-label">👥 مستخدمي Hotspot</div>
                <div class="stat-value" id="hotspotCount">--</div>
                <div class="stat-unit">المتصلون الآن</div>
            </div>

            <div class="stat-card" id="uploadCard">
                <div class="stat-label">📈 Upload</div>
                <div class="stat-value" id="uploadSpeed">--</div>
                <div class="stat-unit">Mbps</div>
            </div>

            <div class="stat-card" id="downloadCard">
                <div class="stat-label">📉 Download</div>
                <div class="stat-value" id="downloadSpeed">--</div>
                <div class="stat-unit">Mbps</div>
            </div>
        </div>

        <div class="update-time" id="updateTime">
            آخر تحديث: --
        </div>
    </div>

    <script>
        // متغيرات
        let updateInterval = null;
        let updateCounter = 0;

        // دالة تحديث البيانات
        function updateData() {
            console.log(`🔄 تحديث البيانات #${++updateCounter}`);
            
            // تحديث معلومات التحديث
            const refreshInfo = document.getElementById('refreshInfo');
            refreshInfo.textContent = `🔄 جاري تحديث البيانات... (${new Date().toLocaleTimeString('ar-SA')})`;

            // جلب بيانات الحالة
            fetch('/api/dashboard/status')
                .then(r => r.json())
                .then(data => {
                    console.log('📊 بيانات Status:', data);
                    
                    // تحديث عدد الأجهزة
                    document.getElementById('deviceCount').textContent = data.online_count || 0;
                    document.getElementById('devicesCard').className = 'stat-card success';
                    
                    // تحديث حالة الإنترنت
                    const internetStatus = document.getElementById('internetStatus');
                    const card = document.getElementById('internetCard');
                    if (data.internet_status === 'online') {
                        internetStatus.textContent = '✅ متصل';
                        card.className = 'stat-card success';
                    } else {
                        internetStatus.textContent = '❌ غير متصل';
                        card.className = 'stat-card error';
                    }
                    document.getElementById('internetMsg').textContent = data.internet_message || 'غير محدد';
                })
                .catch(e => console.error('❌ خطأ Status:', e));

            // جلب اسم الشبكة
            fetch('/api/dashboard/network-identity')
                .then(r => r.json())
                .then(data => {
                    console.log('🌐 بيانات Network:', data);
                    document.getElementById('networkName').textContent = data.identity || '--';
                    document.getElementById('networkCard').className = data.success ? 'stat-card success' : 'stat-card error';
                })
                .catch(e => console.error('❌ خطأ Network:', e));

            // جلب بيانات Hotspot
            fetch('/api/dashboard/hotspot-users')
                .then(r => r.json())
                .then(data => {
                    console.log('👥 بيانات Hotspot:', data);
                    document.getElementById('hotspotCount').textContent = data.hotspot_users || 0;
                    document.getElementById('hotspotCard').className = data.success ? 'stat-card success' : 'stat-card loading';
                })
                .catch(e => console.error('❌ خطأ Hotspot:', e));

            // جلب بيانات المرور
            fetch('/api/dashboard/traffic')
                .then(r => r.json())
                .then(data => {
                    console.log('📊 بيانات Traffic:', data);
                    document.getElementById('uploadSpeed').textContent = (data.current_upload || 0).toFixed(2);
                    document.getElementById('downloadSpeed').textContent = (data.current_download || 0).toFixed(2);
                    document.getElementById('uploadCard').className = 'stat-card success';
                    document.getElementById('downloadCard').className = 'stat-card success';
                })
                .catch(e => console.error('❌ خطأ Traffic:', e));

            // تحديث آخر تحديث
            document.getElementById('updateTime').textContent = 
                `آخر تحديث: ${new Date().toLocaleTimeString('ar-SA')} | عدد التحديثات: ${updateCounter}`;
        }

        // بدء التحديث عند التحميل
        window.addEventListener('load', () => {
            console.log('✅ تم تحميل الصفحة');
            // تحديث فوري
            updateData();
            // تحديث كل 10 ثواني
            updateInterval = setInterval(updateData, 10000);
            document.getElementById('refreshInfo').textContent = '✅ البيانات تتحدث تلقائياً كل 10 ثواني';
        });

        // إيقاف التحديث عند إغلاق الصفحة
        window.addEventListener('beforeunload', () => {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });
    </script>
</body>
</html>
