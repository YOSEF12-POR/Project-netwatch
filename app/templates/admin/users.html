<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدمين - NetWatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200..900&family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050810;
            --panel: #0f1419;
            --panel-hover: #1a1f26;
            --border: #1e2530;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --blue: #38bdf8;
            --cyan: #22d3ee;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
            --purple: #a855f7;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            direction: rtl;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            padding: 20px;
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'Oxanium', monospace;
            font-size: 24px;
            font-weight: 700;
            color: var(--blue);
            margin-bottom: 5px;
        }

        .logo span:first-child { color: var(--cyan); }
        .logo span:last-child { color: var(--blue); }

        .sidebar-nav {
            list-style: none;
        }

        .nav-item {
            margin-bottom: 5px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .nav-link:hover {
            background: var(--panel-hover);
            color: var(--text);
        }

        .nav-link.active {
            background: var(--blue);
            color: white;
        }

        .nav-link i {
            margin-left: 10px;
            width: 20px;
            text-align: center;
        }

        .nav-section {
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: var(--blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            margin: 0 auto 10px;
        }

        .logout-btn {
            background: var(--red);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
            margin-top: 10px;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-right: 280px;
            padding: 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
        }

        .add-btn {
            background: var(--blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-btn:hover {
            background: #0ea5e9;
        }

        /* Users Table */
        .users-table {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .table-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            gap: 8px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 14px;
            outline: none;
            width: 200px;
        }

        .search-box i {
            color: var(--text-secondary);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px 20px;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--bg);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            color: var(--text);
            font-size: 14px;
        }

        tbody tr:hover {
            background: var(--panel-hover);
        }

        .user-avatar-cell {
            width: 40px;
        }

        .user-avatar-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .role-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .role-admin {
            background: var(--purple);
            color: white;
        }

        .role-distributor {
            background: var(--blue);
            color: white;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .status-active {
            background: var(--green);
            color: white;
        }

        .status-inactive {
            background: var(--red);
            color: white;
        }

        .actions-cell {
            width: 120px;
        }

        .action-btn {
            background: none;
            border: none;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 4px;
            font-size: 14px;
        }

        .edit-btn {
            color: var(--blue);
        }

        .edit-btn:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        .delete-btn {
            color: var(--red);
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }

        .modal-close:hover {
            background: var(--panel-hover);
            color: var(--text);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--blue);
        }

        .form-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
            background-position: left 12px center;
            background-repeat: no-repeat;
            background-size: 16px;
            padding-left: 40px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            flex: 1;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--blue);
            color: white;
        }

        .btn-primary:hover {
            background: #0ea5e9;
        }

        .btn-secondary {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--panel-hover);
        }

        .btn-danger {
            background: var(--red);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        /* Alert */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 50%;
            border-top-color: var(--blue);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                width: 240px;
            }
            .main-content {
                margin-right: 240px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(100%);
            }
            .main-content {
                margin-right: 0;
            }
            .page-header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span>NET</span><span>WATCH</span>
                </div>
                <div style="font-size: 12px; color: var(--text-secondary); margin-top: 5px;">
                    لوحة الإدارة
                </div>
            </div>

            <nav>
                <ul class="sidebar-nav">
                    <li class="nav-section">الإدارة</li>
                    <li class="nav-item">
                        <a href="/admin/" class="nav-link">
                            <i>📊</i>
                            لوحة التحكم
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/users" class="nav-link active">
                            <i>👥</i>
                            إدارة المستخدمين
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/networks" class="nav-link">
                            <i>🌐</i>
                            إدارة الشبكات
                        </a>
                    </li>
                    <li class="nav-section">المراقبة</li>
                    <li class="nav-item">
                        <a href="/dashboard/" class="nav-link">
                            <i>📈</i>
                            عرض المراقبة
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="user-info">
                <div class="user-avatar">أ</div>
                <div style="font-size: 14px; color: var(--text); margin-bottom: 5px;">
                    الإدارة
                </div>
                <button class="logout-btn" onclick="logout()">
                    تسجيل الخروج
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">إدارة المستخدمين</h1>
                <button class="add-btn" onclick="openAddModal()">
                    <i>➕</i>
                    إضافة مستخدم جديد
                </button>
            </div>

            <!-- Alert -->
            <div id="alert" class="alert"></div>

            <!-- Users Table -->
            <div class="users-table">
                <div class="table-header">
                    <h2 class="table-title">قائمة المستخدمين</h2>
                    <div class="search-box">
                        <i>🔍</i>
                        <input type="text" id="searchInput" placeholder="البحث في المستخدمين..." onkeyup="filterUsers()">
                    </div>
                </div>

                <div class="table-container">
                    <table id="usersTable">
                        <thead>
                            <tr>
                                <th>المستخدم</th>
                                <th>البريد الإلكتروني</th>
                                <th>الدور</th>
                                <th>الحالة</th>
                                <th>تاريخ التسجيل</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                                    <div class="loading"></div>
                                    جاري تحميل المستخدمين...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit User Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" class="modal-title">إضافة مستخدم جديد</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>

            <form id="userForm">
                <div class="form-group">
                    <label class="form-label">اسم المستخدم *</label>
                    <input type="text" id="username" name="username" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">البريد الإلكتروني *</label>
                    <input type="email" id="email" name="email" class="form-input" required>
                </div>

                <div id="passwordGroup" class="form-group">
                    <label class="form-label">كلمة المرور *</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">الدور *</label>
                        <select id="role" name="role" class="form-input form-select" required>
                            <option value="distributor">موزع</option>
                            <option value="admin">إدارة</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">الحالة</label>
                        <select id="is_active" name="is_active" class="form-input form-select">
                            <option value="true">نشط</option>
                            <option value="false">غير نشط</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">الاسم الكامل</label>
                        <input type="text" id="full_name" name="full_name" class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label">رقم الهاتف</label>
                        <input type="tel" id="phone" name="phone" class="form-input">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">الشركة</label>
                    <input type="text" id="company" name="company" class="form-input">
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <span id="submitText">إضافة المستخدم</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let users = [];
        let currentUserId = null;

        // تحميل المستخدمين عند بدء الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            loadUsers();
        });

        // تحميل قائمة المستخدمين
        async function loadUsers() {
            try {
                const response = await fetch('/admin/api/users');
                const data = await response.json();

                if (data.success) {
                    users = data.users;
                    renderUsersTable(users);
                } else {
                    showAlert('خطأ في تحميل المستخدمين', 'error');
                }
            } catch (error) {
                console.error('خطأ في تحميل المستخدمين:', error);
                showAlert('خطأ في الاتصال بالخادم', 'error');
            }
        }

        // عرض جدول المستخدمين
        function renderUsersTable(usersList) {
            const tbody = document.getElementById('usersTableBody');

            if (usersList.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                            لا توجد مستخدمين
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = usersList.map(user => `
                <tr>
                    <td>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div class="user-avatar-small">${user.username.charAt(0).toUpperCase()}</div>
                            <div>
                                <div style="font-weight: 500; color: var(--text);">${user.username}</div>
                                ${user.full_name ? `<div style="font-size: 12px; color: var(--text-secondary);">${user.full_name}</div>` : ''}
                            </div>
                        </div>
                    </td>
                    <td>${user.email}</td>
                    <td>
                        <span class="role-badge role-${user.role}">
                            ${user.role === 'admin' ? 'إدارة' : 'موزع'}
                        </span>
                    </td>
                    <td>
                        <span class="status-badge ${user.is_active ? 'status-active' : 'status-inactive'}">
                            ${user.is_active ? 'نشط' : 'غير نشط'}
                        </span>
                    </td>
                    <td>${new Date(user.created_at).toLocaleDateString('ar-SA')}</td>
                    <td class="actions-cell">
                        <button class="action-btn edit-btn" onclick="editUser(${user.id})" title="تعديل">
                            ✏️
                        </button>
                        <button class="action-btn delete-btn" onclick="deleteUser(${user.id})" title="حذف">
                            🗑️
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // البحث في المستخدمين
        function filterUsers() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredUsers = users.filter(user =>
                user.username.toLowerCase().includes(searchTerm) ||
                user.email.toLowerCase().includes(searchTerm) ||
                (user.full_name && user.full_name.toLowerCase().includes(searchTerm))
            );
            renderUsersTable(filteredUsers);
        }

        // فتح نافذة إضافة مستخدم
        function openAddModal() {
            currentUserId = null;
            document.getElementById('modalTitle').textContent = 'إضافة مستخدم جديد';
            document.getElementById('submitText').textContent = 'إضافة المستخدم';
            document.getElementById('passwordGroup').style.display = 'block';
            document.getElementById('password').required = true;

            // إعادة تعيين النموذج
            document.getElementById('userForm').reset();
            document.getElementById('role').value = 'distributor';
            document.getElementById('is_active').value = 'true';

            document.getElementById('userModal').classList.add('show');
        }

        // تعديل مستخدم
        function editUser(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;

            currentUserId = userId;
            document.getElementById('modalTitle').textContent = 'تعديل المستخدم';
            document.getElementById('submitText').textContent = 'حفظ التغييرات';
            document.getElementById('passwordGroup').style.display = 'none';
            document.getElementById('password').required = false;

            // ملء البيانات
            document.getElementById('username').value = user.username;
            document.getElementById('email').value = user.email;
            document.getElementById('role').value = user.role;
            document.getElementById('is_active').value = user.is_active.toString();
            document.getElementById('full_name').value = user.full_name || '';
            document.getElementById('phone').value = user.phone || '';
            document.getElementById('company').value = user.company || '';

            document.getElementById('userModal').classList.add('show');
        }

        // حذف مستخدم
        function deleteUser(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;

            if (!confirm(`هل أنت متأكد من حذف المستخدم "${user.username}"؟`)) {
                return;
            }

            // لا يمكن حذف الإدارة الوحيدة
            const adminCount = users.filter(u => u.role === 'admin').length;
            if (user.role === 'admin' && adminCount <= 1) {
                showAlert('لا يمكن حذف الإدارة الوحيدة في النظام', 'error');
                return;
            }

            // إرسال طلب الحذف
            fetch(`/admin/users/${userId}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showAlert('تم حذف المستخدم بنجاح', 'success');
                    loadUsers(); // إعادة تحميل القائمة
                } else {
                    showAlert(data.message || 'خطأ في حذف المستخدم', 'error');
                }
            })
            .catch(error => {
                console.error('خطأ في حذف المستخدم:', error);
                showAlert('خطأ في الاتصال بالخادم', 'error');
            });
        }

        // إرسال النموذج
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<div class="loading"></div> جاري الحفظ...';
            submitBtn.disabled = true;

            const formData = new FormData(this);
            const userData = {
                username: formData.get('username'),
                email: formData.get('email'),
                role: formData.get('role'),
                is_active: formData.get('is_active') === 'true',
                full_name: formData.get('full_name') || null,
                phone: formData.get('phone') || null,
                company: formData.get('company') || null
            };

            // إضافة كلمة المرور للمستخدمين الجدد فقط
            if (!currentUserId) {
                userData.password = formData.get('password');
            }

            const url = currentUserId ? `/admin/users/${currentUserId}` : '/admin/users/add';
            const method = currentUserId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(userData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showAlert(currentUserId ? 'تم تحديث المستخدم بنجاح' : 'تم إضافة المستخدم بنجاح', 'success');
                    closeModal();
                    loadUsers(); // إعادة تحميل القائمة
                } else {
                    showAlert(data.message || 'خطأ في حفظ المستخدم', 'error');
                }
            })
            .catch(error => {
                console.error('خطأ في حفظ المستخدم:', error);
                showAlert('خطأ في الاتصال بالخادم', 'error');
            })
            .finally(() => {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            });
        });

        // إغلاق النافذة المنبثقة
        function closeModal() {
            document.getElementById('userModal').classList.remove('show');
            currentUserId = null;
        }

        // إغلاق النافذة عند النقر خارجها
        document.getElementById('userModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // عرض التنبيهات
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';

            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        // تسجيل الخروج
        function logout() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                fetch('/logout', { method: 'POST' })
                    .then(() => window.location.href = '/login')
                    .catch(() => window.location.href = '/login');
            }
        }
    </script>
</body>
</html>
