<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الشبكات - NetWatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200..900&family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050810;
            --panel: #0f1419;
            --panel-hover: #1a1f26;
            --border: #1e2530;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --blue: #38bdf8;
            --cyan: #22d3ee;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
            --purple: #a855f7;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            direction: rtl;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            padding: 20px;
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'Oxanium', monospace;
            font-size: 24px;
            font-weight: 700;
            color: var(--blue);
            margin-bottom: 5px;
        }

        .logo span:first-child { color: var(--cyan); }
        .logo span:last-child { color: var(--blue); }

        .sidebar-nav {
            list-style: none;
        }

        .nav-item {
            margin-bottom: 5px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .nav-link:hover {
            background: var(--panel-hover);
            color: var(--text);
        }

        .nav-link.active {
            background: var(--blue);
            color: white;
        }

        .nav-link i {
            margin-left: 10px;
            width: 20px;
            text-align: center;
        }

        .nav-section {
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: var(--blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            margin: 0 auto 10px;
        }

        .logout-btn {
            background: var(--red);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
            margin-top: 10px;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-right: 280px;
            padding: 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
        }

        .add-btn {
            background: var(--blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-btn:hover {
            background: #0ea5e9;
        }

        /* Networks Table */
        .networks-table {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .table-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            gap: 8px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 14px;
            outline: none;
            width: 200px;
        }

        .search-box i {
            color: var(--text-secondary);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px 20px;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--bg);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            color: var(--text);
            font-size: 14px;
        }

        tbody tr:hover {
            background: var(--panel-hover);
        }

        .network-avatar-cell {
            width: 40px;
        }

        .network-avatar-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .status-active {
            background: var(--green);
            color: white;
        }

        .status-inactive {
            background: var(--red);
            color: white;
        }

        .actions-cell {
            width: 120px;
        }

        .action-btn {
            background: none;
            border: none;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 4px;
            font-size: 14px;
        }

        .edit-btn {
            color: var(--blue);
        }

        .edit-btn:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        .delete-btn {
            color: var(--red);
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }

        .modal-close:hover {
            background: var(--panel-hover);
            color: var(--text);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--blue);
        }

        .form-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
            background-position: left 12px center;
            background-repeat: no-repeat;
            background-size: 16px;
            padding-left: 40px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            flex: 1;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--blue);
            color: white;
        }

        .btn-primary:hover {
            background: #0ea5e9;
        }

        .btn-secondary {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--panel-hover);
        }

        .btn-danger {
            background: var(--red);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        /* Alert */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 50%;
            border-top-color: var(--blue);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                width: 240px;
            }
            .main-content {
                margin-right: 240px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(100%);
            }
            .main-content {
                margin-right: 0;
            }
            .page-header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-row-3 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span>NET</span><span>WATCH</span>
                </div>
                <div style="font-size: 12px; color: var(--text-secondary); margin-top: 5px;">
                    لوحة الإدارة
                </div>
            </div>

            <nav>
                <ul class="sidebar-nav">
                    <li class="nav-section">الإدارة</li>
                    <li class="nav-item">
                        <a href="/admin/" class="nav-link">
                            <i>📊</i>
                            لوحة التحكم
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/users" class="nav-link">
                            <i>👥</i>
                            إدارة المستخدمين
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/networks" class="nav-link active">
                            <i>🌐</i>
                            إدارة الشبكات
                        </a>
                    </li>
                    <li class="nav-section">المراقبة</li>
                    <li class="nav-item">
                        <a href="/dashboard/" class="nav-link">
                            <i>📈</i>
                            عرض المراقبة
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="user-info">
                <div class="user-avatar">أ</div>
                <div style="font-size: 14px; color: var(--text); margin-bottom: 5px;">
                    الإدارة
                </div>
                <button class="logout-btn" onclick="logout()">
                    تسجيل الخروج
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">إدارة الشبكات</h1>
                <button class="add-btn" onclick="openAddModal()">
                    <i>➕</i>
                    إضافة شبكة جديدة
                </button>
            </div>

            <!-- Alert -->
            <div id="alert" class="alert"></div>

            <!-- Networks Table -->
            <div class="networks-table">
                <div class="table-header">
                    <h2 class="table-title">قائمة الشبكات</h2>
                    <div class="search-box">
                        <i>🔍</i>
                        <input type="text" id="searchInput" placeholder="البحث في الشبكات..." onkeyup="filterNetworks()">
                    </div>
                </div>

                <div class="table-container">
                    <table id="networksTable">
                        <thead>
                            <tr>
                                <th>الشبكة</th>
                                <th>نطاق IP</th>
                                <th>MikroTik</th>
                                <th>المالك</th>
                                <th>الأجهزة</th>
                                <th>الحالة</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="networksTableBody">
                            <tr>
                                <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                                    <div class="loading"></div>
                                    جاري تحميل الشبكات...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Network Modal -->
    <div id="networkModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" class="modal-title">إضافة شبكة جديدة</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>

            <form id="networkForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">اسم الشبكة *</label>
                        <input type="text" id="name" name="name" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">نطاق IP *</label>
                        <input type="text" id="ip_range" name="ip_range" class="form-input" placeholder="192.168.1.0/24" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">الحالة</label>
                        <select id="is_active" name="is_active" class="form-input form-select">
                            <option value="true">نشطة</option>
                            <option value="false">غير نشطة</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">الوصف</label>
                    <textarea id="description" name="description" class="form-input" rows="3" placeholder="وصف الشبكة..."></textarea>
                </div>

                <h3 style="color: var(--text); margin: 20px 0 15px; font-size: 16px;">إعدادات MikroTik</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">IP الراوتر</label>
                        <input type="text" id="mikrotik_ip" name="mikrotik_ip" class="form-input" placeholder="192.168.1.1">
                    </div>

                    <div class="form-group">
                        <label class="form-label">المنفذ</label>
                        <input type="number" id="mikrotik_port" name="mikrotik_port" class="form-input" value="8728" min="1" max="65535">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">اسم المستخدم</label>
                        <input type="text" id="mikrotik_username" name="mikrotik_username" class="form-input" placeholder="admin">
                    </div>

                    <div class="form-group">
                        <label class="form-label">كلمة المرور</label>
                        <input type="password" id="mikrotik_password" name="mikrotik_password" class="form-input" placeholder="كلمة مرور MikroTik">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">المالك (المستخدم) *</label>
                    <select id="user_id" name="user_id" class="form-input form-select" required>
                        <option value="">اختر المستخدم...</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <span id="submitText">إضافة الشبكة</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let networks = [];
        let users = [];
        let currentNetworkId = null;

        // تحميل البيانات عند بدء الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            loadNetworks();
            loadUsers();
        });

        // تحميل قائمة الشبكات
        async function loadNetworks() {
            try {
                const response = await fetch('/admin/api/networks');
                const data = await response.json();

                if (data.success) {
                    networks = data.networks;
                    renderNetworksTable(networks);
                } else {
                    showAlert('خطأ في تحميل الشبكات', 'error');
                }
            } catch (error) {
                console.error('خطأ في تحميل الشبكات:', error);
                showAlert('خطأ في الاتصال بالخادم', 'error');
            }
        }

        // تحميل قائمة المستخدمين
        async function loadUsers() {
            try {
                const response = await fetch('/admin/api/users');
                const data = await response.json();

                if (data.success) {
                    users = data.users;
                    populateUserSelect();
                }
            } catch (error) {
                console.error('خطأ في تحميل المستخدمين:', error);
            }
        }

        // ملء قائمة المستخدمين في النموذج
        function populateUserSelect() {
            const select = document.getElementById('user_id');
            select.innerHTML = '<option value="">اختر المستخدم...</option>';

            users.forEach(user => {
                const option = document.createElement('option');
                option.value = user.id;
                option.textContent = `${user.username} (${user.role === 'admin' ? 'إدارة' : 'موزع'})`;
                select.appendChild(option);
            });
        }

        // عرض جدول الشبكات
        function renderNetworksTable(networksList) {
            const tbody = document.getElementById('networksTableBody');

            if (networksList.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                            لا توجد شبكات
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = networksList.map(network => {
                const owner = users.find(u => u.id === network.user_id);
                const ownerName = owner ? owner.username : 'غير محدد';

                return `
                    <tr>
                        <td>
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <div class="network-avatar-small">🌐</div>
                                <div>
                                    <div style="font-weight: 500; color: var(--text);">${network.name}</div>
                                    ${network.description ? `<div style="font-size: 12px; color: var(--text-secondary);">${network.description}</div>` : ''}
                                </div>
                            </div>
                        </td>
                        <td>${network.ip_range}</td>
                        <td>
                            ${network.mikrotik_ip ? `
                                <div style="font-size: 12px;">
                                    <div>${network.mikrotik_ip}:${network.mikrotik_port || 8728}</div>
                                    <div style="color: var(--text-secondary);">${network.mikrotik_username || 'غير محدد'}</div>
                                </div>
                            ` : '<span style="color: var(--text-secondary);">غير محدد</span>'}
                        </td>
                        <td>${ownerName}</td>
                        <td>${network.device_count || 0} جهاز</td>
                        <td>
                            <span class="status-badge ${network.is_active ? 'status-active' : 'status-inactive'}">
                                ${network.is_active ? 'نشطة' : 'غير نشطة'}
                            </span>
                        </td>
                        <td class="actions-cell">
                            <button class="action-btn edit-btn" onclick="editNetwork(${network.id})" title="تعديل">
                                ✏️
                            </button>
                            <button class="action-btn delete-btn" onclick="deleteNetwork(${network.id})" title="حذف">
                                🗑️
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // البحث في الشبكات
        function filterNetworks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredNetworks = networks.filter(network =>
                network.name.toLowerCase().includes(searchTerm) ||
                (network.ip_range && network.ip_range.toLowerCase().includes(searchTerm)) ||
                (network.description && network.description.toLowerCase().includes(searchTerm))
            );
            renderNetworksTable(filteredNetworks);
        }

        // فتح نافذة إضافة شبكة
        function openAddModal() {
            currentNetworkId = null;
            document.getElementById('modalTitle').textContent = 'إضافة شبكة جديدة';
            document.getElementById('submitText').textContent = 'إضافة الشبكة';

            // إعادة تعيين النموذج
            document.getElementById('networkForm').reset();
            document.getElementById('is_active').value = 'true';
            document.getElementById('mikrotik_port').value = '8728';

            document.getElementById('networkModal').classList.add('show');
        }

        // تعديل شبكة
        function editNetwork(networkId) {
            const network = networks.find(n => n.id === networkId);
            if (!network) return;

            currentNetworkId = networkId;
            document.getElementById('modalTitle').textContent = 'تعديل الشبكة';
            document.getElementById('submitText').textContent = 'حفظ التغييرات';

            // ملء البيانات
            document.getElementById('name').value = network.name;
            document.getElementById('ip_range').value = network.ip_range || '';
            document.getElementById('is_active').value = network.is_active.toString();
            document.getElementById('description').value = network.description || '';
            document.getElementById('mikrotik_ip').value = network.mikrotik_ip || '';
            document.getElementById('mikrotik_port').value = network.mikrotik_port || 8728;
            document.getElementById('mikrotik_username').value = network.mikrotik_username || '';
            document.getElementById('mikrotik_password').value = network.mikrotik_password || '';
            document.getElementById('user_id').value = network.user_id;

            document.getElementById('networkModal').classList.add('show');
        }

        // حذف شبكة
        function deleteNetwork(networkId) {
            const network = networks.find(n => n.id === networkId);
            if (!network) return;

            if (!confirm(`هل أنت متأكد من حذف الشبكة "${network.name}"؟`)) {
                return;
            }

            // إرسال طلب الحذف
            fetch(`/admin/networks/${networkId}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showAlert('تم حذف الشبكة بنجاح', 'success');
                    loadNetworks(); // إعادة تحميل القائمة
                } else {
                    showAlert(data.message || 'خطأ في حذف الشبكة', 'error');
                }
            })
            .catch(error => {
                console.error('خطأ في حذف الشبكة:', error);
                showAlert('خطأ في الاتصال بالخادم', 'error');
            });
        }

        // إرسال النموذج
        document.getElementById('networkForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<div class="loading"></div> جاري الحفظ...';
            submitBtn.disabled = true;

            const formData = new FormData(this);
            const networkData = {
                name: formData.get('name'),
                ip_range: formData.get('ip_range'),
                is_active: formData.get('is_active') === 'true',
                description: formData.get('description') || null,
                mikrotik_ip: formData.get('mikrotik_ip') || null,
                mikrotik_port: parseInt(formData.get('mikrotik_port')) || 8728,
                mikrotik_username: formData.get('mikrotik_username') || null,
                mikrotik_password: formData.get('mikrotik_password') || null,
                user_id: parseInt(formData.get('user_id'))
            };

            const url = currentNetworkId ? `/admin/networks/${currentNetworkId}` : '/admin/networks/add';
            const method = currentNetworkId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(networkData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showAlert(currentNetworkId ? 'تم تحديث الشبكة بنجاح' : 'تم إضافة الشبكة بنجاح', 'success');
                    closeModal();
                    loadNetworks(); // إعادة تحميل القائمة
                } else {
                    showAlert(data.message || 'خطأ في حفظ الشبكة', 'error');
                }
            })
            .catch(error => {
                console.error('خطأ في حفظ الشبكة:', error);
                showAlert('خطأ في الاتصال بالخادم', 'error');
            })
            .finally(() => {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            });
        });

        // إغلاق النافذة المنبثقة
        function closeModal() {
            document.getElementById('networkModal').classList.remove('show');
            currentNetworkId = null;
        }

        // إغلاق النافذة عند النقر خارجها
        document.getElementById('networkModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // عرض التنبيهات
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';

            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        // تسجيل الخروج
        function logout() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                fetch('/logout', { method: 'POST' })
                    .then(() => window.location.href = '/login')
                    .catch(() => window.location.href = '/login');
            }
        }
    </script>
</body>
</html>
